# Phase 3.5 — explicit macro placement for the SoC OpenRAM run.
#
# Format: <instance_name> <x_um> <y_um> <orientation>
#   - Coordinates are the macro's lower-left corner, relative to the die
#     origin (0,0).
#   - Orientation N = R0 (no rotation), placing the macro with pins on
#     its declared sides.
#
# Both macros placed along the top edge of the die, side by side, with
# 50 µm clearance from the die edges. Std-cell logic occupies the rest
# of the die below them.
#
# Macro sizes (from sky130_sram_macros LEFs):
#   sky130_sram_2kbyte_1rw1r_32x512_8: 683.10 × 416.54 µm
#   sky130_sram_1kbyte_1rw1r_32x256_8: 479.78 × 397.50 µm
#
# Die area: 1500 × 1500 µm (set absolutely via FP_DIE_AREA in
# config.json so the placement coordinates are deterministic regardless
# of std-cell area changes between runs).
#
# Layout (looking at die from above, origin at lower-left):
#
#                         x=50          x=783        x=1313
#                          ↓             ↓             ↓
#   y=1450 (top - 50) ───┌─────────┐   ┌──────┐
#                        │  IMEM   │   │ DMEM │
#                        │ 683×417 │   │480×398│
#   y≈1033/1052 ─────────└─────────┘   └──────┘
#
#                       (std cells fill the remaining area below)
#
# IMEM lower-left:  (50,    1500 - 50 - 416.54) = (50,    1033.46)
# DMEM lower-left:  (50 + 683.10 + 50, 1500 - 50 - 397.50)
#                = (783.10, 1052.50)

u_imem.u_macro    50.00   1033.46   N
u_dmem.u_macro    783.10  1052.50   N
